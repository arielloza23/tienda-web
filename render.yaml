services:
  - type: web
    name: tienda-web-api
    runtime: python
    plan: free
    branch: master
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.18
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: AUTH_ENABLED
        value: "true"
      - key: CORS_ORIGINS
        value: '["https://arielloza23.github.io"]'
